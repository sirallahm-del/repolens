<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rendez-vous — NOVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
<style>
  .timeline{ display:flex; flex-direction:column; }
  .tl-row{ display:grid; grid-template-columns:70px 1fr; gap:16px; padding:14px 0; border-bottom:1px solid var(--border); }
  .tl-row:last-child{ border-bottom:none; }
  .tl-time{ font-size:13px; font-weight:700; color:var(--text-muted); }
  .tl-card{ display:flex; align-items:center; gap:10px; }
  .tl-dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); flex-shrink:0; }
  .tl-label{ font-weight:600; font-size:13.5px; }
  .tl-client{ font-size:12.5px; color:var(--text-muted); }
</style>
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <a href="index.html" class="brand"><span class="brand-mark"></span>NOVA</a>
    <div class="side-search" data-cmdk-trigger><i data-lucide="search"></i> Rechercher... <kbd>⌘K</kbd></div>
    <nav class="side-nav">
      <a href="dashboard.html"><i data-lucide="layout-dashboard"></i>Dashboard</a>
      <a href="clients.html"><i data-lucide="users"></i>Clients</a>
      <a href="devis.html"><i data-lucide="file-text"></i>Devis</a>
      <a href="factures.html"><i data-lucide="receipt"></i>Factures</a>
      <a href="produits.html"><i data-lucide="package"></i>Produits</a>
      <a href="paiements.html"><i data-lucide="credit-card"></i>Paiements</a>
      <a href="depenses.html"><i data-lucide="wallet"></i>Dépenses</a>
      <a href="rendezvous.html" class="active"><i data-lucide="calendar"></i>Rendez-vous</a>
      <div class="side-sep"></div>
      <a href="settings.html"><i data-lucide="settings"></i>Paramètres</a>
      <a href="#"><i data-lucide="help-circle"></i>Aide</a>
    </nav>
    <div class="side-foot">
      <button class="theme-toggle" style="align-self:flex-start;margin-bottom:6px;" onclick="novaToggleTheme()"><i data-lucide="moon" class="icon-moon"></i><i data-lucide="sun" class="icon-sun"></i></button>
      <div class="user-chip"><div class="avatar">AH</div><div><div class="u-name">Ahmed</div><div class="u-role">Atlas Climatisation</div></div></div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Rendez-vous</h1>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" onclick="novaToast('Rendez-vous ajouté')"><i data-lucide="plus"></i>Ajouter</button>
      </div>
    </div>

    <div class="tabs">
      <div class="tab active">Aujourd'hui</div>
      <div class="tab">Demain</div>
      <div class="tab">Cette semaine</div>
    </div>

    <div class="panel">
      <div class="timeline" id="rdv-timeline"></div>
    </div>
  </main>
</div>

<nav class="mobile-nav">
  <a href="dashboard.html"><i data-lucide="layout-dashboard"></i>Accueil</a>
  <a href="clients.html"><i data-lucide="users"></i>Clients</a>
  <a href="devis.html"><i data-lucide="file-text"></i>Devis</a>
  <a href="factures.html"><i data-lucide="receipt"></i>Factures</a>
  <a href="settings.html"><i data-lucide="more-horizontal"></i>Plus</a>
</nav>

<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const d = NOVA.data();
  const today = d.appointments.filter(a => a.day === 'today');
  document.getElementById('rdv-timeline').innerHTML = today.map(a => `
    <div class="tl-row">
      <div class="tl-time">${a.time}</div>
      <div class="tl-card"><span class="tl-dot"></span><div><div class="tl-label">${a.label}</div><div class="tl-client">${a.client}</div></div></div>
    </div>`).join('');
  novaIcons();
});
</script>
</body>
</html>
