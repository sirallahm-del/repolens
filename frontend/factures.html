<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factures — NOVA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app-shell">

  <aside class="sidebar">
    <a href="index.html" class="brand"><span class="brand-mark"></span>NOVA</a>
    <div class="side-search" data-cmdk-trigger><i data-lucide="search"></i> Rechercher... <kbd>⌘K</kbd></div>
    <nav class="side-nav">
      <a href="dashboard.html"><i data-lucide="layout-dashboard"></i>Dashboard</a>
      <a href="clients.html"><i data-lucide="users"></i>Clients</a>
      <a href="devis.html"><i data-lucide="file-text"></i>Devis</a>
      <a href="factures.html" class="active"><i data-lucide="receipt"></i>Factures</a>
      <a href="produits.html"><i data-lucide="package"></i>Produits</a>
      <a href="paiements.html"><i data-lucide="credit-card"></i>Paiements</a>
      <a href="depenses.html"><i data-lucide="wallet"></i>Dépenses</a>
      <a href="rendezvous.html"><i data-lucide="calendar"></i>Rendez-vous</a>
      <div class="side-sep"></div>
      <a href="settings.html"><i data-lucide="settings"></i>Paramètres</a>
      <a href="#"><i data-lucide="help-circle"></i>Aide</a>
    </nav>
    <div class="side-foot">
      <button class="theme-toggle" style="align-self:flex-start;margin-bottom:6px;" onclick="novaToggleTheme()"><i data-lucide="moon" class="icon-moon"></i><i data-lucide="sun" class="icon-sun"></i></button>
      <div class="user-chip"><div class="avatar">AH</div><div><div class="u-name">Ahmed</div><div class="u-role">Atlas Climatisation</div></div></div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <h1>Factures</h1>
      <div class="topbar-actions">
        <button class="btn btn-primary btn-sm" onclick="novaNewFacture()"><i data-lucide="plus"></i>Nouvelle facture</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="search-box"><i data-lucide="search"></i><input type="text" id="fac-search" placeholder="Rechercher une facture, un client..."></div>
      <div class="filter-chip" onclick="novaFilterStatus('all')"><i data-lucide="filter"></i>Toutes</div>
      <div class="filter-chip" onclick="novaFilterStatus('En retard')"><i data-lucide="alert-triangle"></i>En retard</div>
    </div>

    <div class="panel" style="padding:0;">
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>N°</th><th>Client</th><th>Date</th><th style="text-align:right;">Montant</th><th>Statut</th><th></th></tr></thead>
          <tbody id="fac-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<nav class="mobile-nav">
  <a href="dashboard.html"><i data-lucide="layout-dashboard"></i>Accueil</a>
  <a href="clients.html"><i data-lucide="users"></i>Clients</a>
  <a href="devis.html"><i data-lucide="file-text"></i>Devis</a>
  <a href="factures.html" class="active"><i data-lucide="receipt"></i>Factures</a>
  <a href="settings.html"><i data-lucide="more-horizontal"></i>Plus</a>
</nav>

<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script src="js/factures.js"></script>
</body>
</html>
